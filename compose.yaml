services:
  division2-status-watch:
    build: .
    container_name: division2-status-watch
    restart: unless-stopped
    ports:
      - "${PORT:-3274}:8080"
    environment:
      WEB_USERNAME: "${WEB_USERNAME:-admin}"
      WEB_PASSWORD: "${WEB_PASSWORD:?Set WEB_PASSWORD in the Portainer stack environment variables}"
      DATA_DIR: /data
      PORT: 8080
      LOG_LEVEL: INFO
    volumes:
      - division2-status-data:/data

volumes:
  division2-status-data:
